<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collage: a cut-paper theme for Home Assistant</title>
<style>
  /* A stand-in for Home Assistant's page: a black header with tabs, and a view on the wall. */
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--lovelace-background, #15161C); font-family: var(--ha-font-family-body, sans-serif); }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 18px; height: 56px; padding: 0 16px;
    background: var(--app-header-background-color); color: var(--app-header-text-color); }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  header nav { display: flex; height: 100%; overflow-x: auto; }
  header a { display: grid; place-items: center; padding: 0 14px; color: inherit; text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
  header a[aria-current="page"] { border-color: var(--app-header-selection-bar-color); color: var(--app-header-selection-bar-color); }
  header .note { margin-left: auto; font-size: 12px; opacity: .7; white-space: nowrap; }
  main { overflow-x: clip; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px 20px;
    max-width: 1300px; margin: 0 auto; padding: 22px 16px 60px; align-items: start; }
  .col { display: grid; gap: 22px; align-content: start; min-width: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 14px; }
  .heading { margin: 4px 0 -8px; color: var(--ha-heading-card-title-color); font-size: 18px; font-weight: 700; }
  @media (max-width: 600px) { header .note { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Collage</h1>
  <nav id="tabs"></nav>
  <span class="note">A demo with made-up entities. Nothing here is a real house.</span>
</header>
<main id="view"></main>
<script type="module" src="./demo.js"></script>
</body>
</html>
